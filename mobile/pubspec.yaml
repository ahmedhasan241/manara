name: educloud
description: Manara mobile app for students, teachers and parents.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  sodium: ^4.1.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
